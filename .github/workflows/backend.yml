name: Backend CI/CD

on:
  push:
    branches:
      - develop

  pull_request:
    branches:
      - develop

permissions:
  contents: read
  packages: write

jobs:

  # ============================================================
  # BUILD AND PUSH DOCKER IMAGE
  # ============================================================
  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------------------------
      # Checkout source code
      # ----------------------------------------------------------
      - name: Checkout source code
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # Setup .NET
      # ----------------------------------------------------------
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # ----------------------------------------------------------
      # Restore
      # ----------------------------------------------------------
      - name: Restore
        run: dotnet restore Poc.Api.csproj

      # ----------------------------------------------------------
      # Build
      # ----------------------------------------------------------
      - name: Build
        run: dotnet build Poc.Api.csproj --configuration Release --no-restore

      # ----------------------------------------------------------
      # Publish
      # ----------------------------------------------------------
      - name: Publish
        run: dotnet publish Poc.Api.csproj --configuration Release --output ./publish --no-restore

      # ----------------------------------------------------------
      # Login to GitHub Container Registry
      # ----------------------------------------------------------
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ----------------------------------------------------------
      # Build Docker Image
      # ----------------------------------------------------------
      - name: Build Docker Image
        run: docker build -t ghcr.io/kmg-chandrashekhar2157/poc-api:${{ github.sha }} .

      # ----------------------------------------------------------
      # Push Docker Image
      # ----------------------------------------------------------
      - name: Push Docker Image
        run: docker push ghcr.io/kmg-chandrashekhar2157/poc-api:${{ github.sha }}


  # ============================================================
  # DEPLOY TO WINDOWS DOCKER SERVER
  # ============================================================
  deploy:
    name: Deploy to Docker Server

    # Build must finish successfully first
    needs: build

    # IMPORTANT:
    # Deploy only on direct push to develop.
    # Pull requests will NOT deploy.
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    # Self-hosted Windows Docker server
    runs-on: self-hosted

    steps:

      # ========================================================
      # CONFIGURE VERIFIED DOCKER PATH
      # ========================================================
      - name: Configure Docker PATH
        shell: powershell
        run: |
          $dockerExe = "C:\Users\KMG\AppData\Local\Programs\DockerDesktop\resources\bin\docker.exe"

          Write-Host "========================================"
          Write-Host "Checking Docker executable"
          Write-Host "========================================"

          Write-Host $dockerExe

          if (-not (Test-Path $dockerExe)) {
              Write-Error "Docker executable was not found at the verified location."
              exit 1
          }

          $dockerPath = Split-Path $dockerExe -Parent

          Write-Host ""
          Write-Host "Docker executable found:"
          Write-Host $dockerExe

          Write-Host ""
          Write-Host "Docker directory:"
          Write-Host $dockerPath

          Add-Content -Path $env:GITHUB_PATH -Value $dockerPath

          Write-Host ""
          Write-Host "Docker path added to GitHub Actions PATH."


      # ========================================================
      # VERIFY DOCKER
      # ========================================================
      - name: Verify Docker
        shell: powershell
        run: |
          Write-Host "========================================"
          Write-Host "CURRENT USER"
          Write-Host "========================================"

          whoami

          Write-Host ""
          Write-Host "========================================"
          Write-Host "DOCKER LOCATION"
          Write-Host "========================================"

          where.exe docker

          Write-Host ""
          Write-Host "========================================"
          Write-Host "DOCKER VERSION"
          Write-Host "========================================"

          docker --version

          Write-Host ""
          Write-Host "========================================"
          Write-Host "DOCKER CONTAINERS"
          Write-Host "========================================"

          docker ps


      # ========================================================
      # LOGIN TO GHCR
      # ========================================================
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # ========================================================
      # PULL EXACT IMAGE CREATED BY BUILD JOB
      # ========================================================
      - name: Pull Docker Image
        shell: powershell
        run: |
          $image = "ghcr.io/kmg-chandrashekhar2157/poc-api:${{ github.sha }}"

          Write-Host "========================================"
          Write-Host "Pulling Docker Image"
          Write-Host "========================================"

          Write-Host $image

          docker pull $image


      # ========================================================
      # STOP AND REMOVE EXISTING CONTAINER
      # ========================================================
      - name: Stop Existing Container
        shell: powershell
        run: |
          Write-Host "========================================"
          Write-Host "Removing existing poc-api container"
          Write-Host "========================================"

          docker rm -f poc-api 2>$null

          Write-Host "Existing container removed if it existed."


      # ========================================================
      # START NEW CONTAINER
      # ========================================================
      - name: Start New Container
        shell: powershell
        run: |
          $image = "ghcr.io/kmg-chandrashekhar2157/poc-api:${{ github.sha }}"

          Write-Host "========================================"
          Write-Host "Starting new poc-api container"
          Write-Host "========================================"

          Write-Host "Image:"
          Write-Host $image

          docker run -d `
            --name poc-api `
            --restart unless-stopped `
            -e ASPNETCORE_ENVIRONMENT=Development `
            -p 8091:8080 `
            $image


      # ========================================================
      # VERIFY CONTAINER
      # ========================================================
      - name: Verify Container
        shell: powershell
        run: |
          Write-Host "Waiting for application to start..."

          Start-Sleep -Seconds 5

          Write-Host ""
          Write-Host "========================================"
          Write-Host "DOCKER PS"
          Write-Host "========================================"

          docker ps

          Write-Host ""
          Write-Host "========================================"
          Write-Host "POC-API CONTAINER LOGS"
          Write-Host "========================================"

          docker logs poc-api --tail 30
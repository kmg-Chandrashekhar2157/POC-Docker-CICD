name: Backend CI/CD

on:
  push:
    branches:
      - develop

  pull_request:
    branches:
      - develop

permissions:
  contents: read
  packages: write

jobs:

  # ==========================================
  # BUILD + DOCKER IMAGE
  # ==========================================
  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Poc.Api.csproj

      - name: Build
        run: dotnet build Poc.Api.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish Poc.Api.csproj --configuration Release --output ./publish --no-restore

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build \
            -t ghcr.io/kmg-chandrashekhar2157/poc-api:${{ github.sha }} \
            .

      - name: Push Docker Image
        run: |
          docker push \
            ghcr.io/kmg-chandrashekhar2157/poc-api:${{ github.sha }}


  # ==========================================
  # DEPLOY TO WINDOWS DOCKER SERVER
  # ==========================================
  deploy:
    name: Deploy to Docker Server

    needs: build

    # IMPORTANT:
    # Deploy only when code is pushed to develop.
    # Do NOT deploy pull requests.
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    runs-on: self-hosted

    steps:

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Latest Docker Image
        shell: powershell
        run: |
          docker pull ghcr.io/kmg-chandrashekhar2157/poc-api:${{ github.sha }}

      - name: Stop Existing Container
        shell: powershell
        run: |
          docker rm -f poc-api 2>$null

      - name: Start New Container
        shell: powershell
        run: |
          docker run -d `
            --name poc-api `
            --restart unless-stopped `
            -e ASPNETCORE_ENVIRONMENT=Development `
            -p 8091:8080 `
            ghcr.io/kmg-chandrashekhar2157/poc-api:${{ github.sha }}

      - name: Verify Container
        shell: powershell
        run: |
          Start-Sleep -Seconds 5
          docker ps
          docker logs poc-api --tail 30
name: Backend CI/CD

on:
  push:
    branches:
      - develop

  pull_request:
    branches:
      - develop

permissions:
  contents: read
  packages: write

jobs:

  # ============================================================
  # BUILD AND PUSH DOCKER IMAGE
  # ============================================================
  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Poc.Api.csproj

      - name: Build
        run: dotnet build Poc.Api.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish Poc.Api.csproj --configuration Release --output ./publish --no-restore

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image
        run: docker build -t ghcr.io/kmg-chandrashekhar2157/poc-api:${{ github.sha }} .

      - name: Push Docker Image
        run: docker push ghcr.io/kmg-chandrashekhar2157/poc-api:${{ github.sha }}


  # ============================================================
  # DEPLOY TO WINDOWS DOCKER SERVER
  # ============================================================
  deploy:
    name: Deploy to Docker Server

    needs: build

    # Deploy only for direct push to develop
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    runs-on: self-hosted

    steps:

      # ----------------------------------------------------------
      # Find Docker and add it to PATH
      # ----------------------------------------------------------
      - name: Configure Docker PATH
        shell: powershell
        run: |
          $dockerCommand = Get-Command docker.exe -ErrorAction Stop
          $dockerPath = Split-Path $dockerCommand.Source

          Write-Host "Docker executable: $($dockerCommand.Source)"
          Write-Host "Docker path: $dockerPath"

          Add-Content -Path $env:GITHUB_PATH -Value $dockerPath

      # ----------------------------------------------------------
      # Verify Docker
      # ----------------------------------------------------------
      - name: Verify Docker
        shell: powershell
        run: |
          Write-Host "Checking Docker..."
          where.exe docker
          docker --version
          Write-Host "Docker is available."

      # ----------------------------------------------------------
      # Login to GHCR
      # ----------------------------------------------------------
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ----------------------------------------------------------
      # Pull exact image created by Build job
      # ----------------------------------------------------------
      - name: Pull Docker Image
        shell: powershell
        run: |
          docker pull ghcr.io/kmg-chandrashekhar2157/poc-api:${{ github.sha }}

      # ----------------------------------------------------------
      # Stop existing container
      # ----------------------------------------------------------
      - name: Stop Existing Container
        shell: powershell
        run: |
          docker rm -f poc-api 2>$null

      # ----------------------------------------------------------
      # Start new container
      # ----------------------------------------------------------
      - name: Start New Container
        shell: powershell
        run: |
          docker run -d `
            --name poc-api `
            --restart unless-stopped `
            -e ASPNETCORE_ENVIRONMENT=Development `
            -p 8091:8080 `
            ghcr.io/kmg-chandrashekhar2157/poc-api:${{ github.sha }}

      # ----------------------------------------------------------
      # Verify container
      # ----------------------------------------------------------
      - name: Verify Container
        shell: powershell
        run: |
          Start-Sleep -Seconds 5

          Write-Host "===== Docker PS ====="
          docker ps

          Write-Host "===== Container Logs ====="
          docker logs poc-api --tail 30